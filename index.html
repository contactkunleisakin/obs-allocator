<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Observation Allocator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a365d; margin-top: 0; }
        .setup-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #4a5568; }
        textarea, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 80px; resize: none; }
        .btn-group { margin-top: 15px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        .btn-generate { background-color: #2b6cb0; color: white; }
        .btn-generate:hover { background-color: #2c5282; }
        .btn-reset { background-color: #e53e3e; color: white; margin-left: 10px; }
        .btn-reset:hover { background-color: #9b2c2c; }
        
        .results-section { margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #cbd5e1; padding: 12px; text-align: left; }
        th { background-color: #2d3748; color: white; }
        tr:nth-child(even) { background-color: #f8fafc; }
        
        /* Clear Welfare Status Badges */
        .badge-obs { background-color: #fed7d7; color: #9b2c2c; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; margin: 2px; }
        .badge-rest2 { background-color: #c6f6d5; color: #22543d; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .badge-rest1 { background-color: #feebc8; color: #744210; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .badge-ward { background-color: #e2e8f0; color: #4a5568; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .warning-msg { color: #dd6b20; font-weight: bold; margin-top: 10px; display: none; background: #fffaf0; padding: 10px; border-left: 4px solid #dd6b20; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 Ward Observation Allocator</h1>
    <p>Distributes observation duties across a 12.5-hour shift. Enforces a <strong>minimum 2-hour consecutive rest block</strong>, dynamically scaling down to 1 hour only if ward safety is compromised.</p>
    
    <!-- User Input Areas -->
    <div class="setup-section">
        <div>
            <label for="staffInput">Staff Members (Comma separated):</label>
            <textarea id="staffInput" placeholder="Nurse Sarah, RMN John, HCA Emily, HCA David, Nurse Alex, HCA Chris"></textarea>
        </div>
        <div>
            <label for="obsNeeded">Number of Active Observation Slots Needed Per Hour:</label>
            <input type="number" id="obsNeeded" value="2" min="1" max="10">
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
        <button class="btn-generate" onclick="generateSchedule()">⚡ Generate Allocations</button>
        <button class="btn-reset" onclick="resetApp()">Reset App</button>
    </div>

    <!-- Safety Banner Warning Container -->
    <div id="safetyWarning" class="warning-msg"></div>

    <!-- Table Output Container -->
    <div class="results-section">
        <h2>Shift Schedule (12.5 Hours Matrix)</h2>
        <div id="scheduleOutput">Submit staff to generate an optimized roster.</div>
    </div>
</div>

<!-- 🔴 THE ALGORITHM CODE GOES BELOW THIS LINE 🔴 -->
<script>
    const shiftHours = [
    "07:00 - 08:00", "08:00 - 09:00", "09:00 - 10:00", "10:00 - 11:00", 
    "11:00 - 12:00", "12:00 - 13:00", "13:00 - 14:00", "14:00 - 15:00", 
    "15:00 - 16:00", "16:00 - 17:00", "17:00 - 18:00", "18:00 - 19:00", 
    "19:00 - 19:30 (0.5h)"
];

function generateSchedule() {
    const staffRaw = document.getElementById("staffInput").value;
    const slotsNeeded = parseInt(document.getElementById("obsNeeded").value);
    const warningDiv = document.getElementById("safetyWarning");
    warningDiv.style.display = "none";
    
    let staffList = staffRaw.split(',').map(s => s.trim()).filter(s => s.length > 0);
    
    if (staffList.length === 0) {
        alert("Please enter at least a few staff members!");
        return;
    }
    if (staffList.length <= slotsNeeded) {
        alert("Error: Insufficient headcount to cover basic hourly observation needs.");
        return;
    }

    let staffMetrics = {};
    staffList.forEach(staff => {
        staffMetrics[staff] = { 
            totalObsHours: 0, 
            consecutiveObs: 0, 
            consecutiveRest: 0,
            assignedThisHour: false 
        };
    });

    let safetyCompromiseTriggered = false;
    let tableHtml = `<table><thead><tr><th>Time Window</th><th>Observation Tasks (Max 2h consecutive)</th><th>Welfare / Rest Status (Min 2h or 1h safety fall-back)</th></tr></thead><tbody>`;

    for (let h = 0; h < shiftHours.length; h++) {
        staffList.forEach(s => staffMetrics[s].assignedThisHour = false);
        
        let eligibleStaff = [...staffList].sort((a, b) => {
            if (staffMetrics[b].consecutiveObs !== staffMetrics[a].consecutiveObs) {
                return staffMetrics[b].consecutiveObs - staffMetrics[a].consecutiveObs;
            }
            let aNeedsRest = staffMetrics[a].consecutiveRest > 0 && staffMetrics[a].consecutiveRest < 2;
            let bNeedsRest = staffMetrics[b].consecutiveRest > 0 && staffMetrics[b].consecutiveRest < 2;
            if (aNeedsRest !== bNeedsRest) {
                return aNeedsRest ? 1 : -1; 
            }
            return staffMetrics[a].totalObsHours - staffMetrics[b].totalObsHours;
        });

        let hourlyObsAssignments = [];
        let assignedCount = 0;

        for (let person of eligibleStaff) {
            if (assignedCount >= slotsNeeded) break;
            if (staffMetrics[person].consecutiveRest > 0 && staffMetrics[person].consecutiveRest < 2) continue; 
            if (staffMetrics[person].consecutiveObs >= 2) continue;

            hourlyObsAssignments.push(person);
            staffMetrics[person].totalObsHours += (h === 12 ? 0.5 : 1);
            staffMetrics[person].consecutiveObs += 1;
            staffMetrics[person].consecutiveRest = 0;
            staffMetrics[person].assignedThisHour = true;
            assignedCount++;
        }

        if (assignedCount < slotsNeeded) {
            for (let person of eligibleStaff) {
                if (assignedCount >= slotsNeeded) break;
                if (staffMetrics[person].assignedThisHour) continue;

                if (staffMetrics[person].consecutiveRest >= 1) {
                    hourlyObsAssignments.push(person);
                    staffMetrics[person].totalObsHours += (h === 12 ? 0.5 : 1);
                    staffMetrics[person].consecutiveObs += 1;
                    staffMetrics[person].consecutiveRest = 0;
                    staffMetrics[person].assignedThisHour = true;
                    assignedCount++;
                    safetyCompromiseTriggered = true;
                }
            }
        }

        if (assignedCount < slotsNeeded) {
            for (let person of eligibleStaff) {
                if (assignedCount >= slotsNeeded) break;
                if (!staffMetrics[person].assignedThisHour) {
                    hourlyObsAssignments.push(person);
                    staffMetrics[person].totalObsHours += (h === 12 ? 0.5 : 1);
                    staffMetrics[person].consecutiveObs += 1;
                    staffMetrics[person].consecutiveRest = 0;
                    staffMetrics[person].assignedThisHour = true;
                    assignedCount++;
                    safetyCompromiseTriggered = true;
                }
            }
        }

        let hourlyWardAssignments = [];
        staffList.forEach(person => {
            if (!staffMetrics[person].assignedThisHour) {
                staffMetrics[person].consecutiveObs = 0; 
                staffMetrics[person].consecutiveRest += 1; 

                let restDuration = staffMetrics[person].consecutiveRest;
                if (restDuration >= 2) {
                    hourlyWardAssignments.push(`${person} <span class="badge-rest2">Resting (Block: ${restDuration}h)</span>`);
                } else if (restDuration === 1) {
                    hourlyWardAssignments.push(`${person} <span class="badge-rest1">Resting (Block: 1h)</span>`);
                } else {
                    hourlyWardAssignments.push(`${person} <span class="badge-ward">Floor Duty</span>`);
                }
            }
        });

        let obsDisplay = hourlyObsAssignments.map(p => `<span class="badge-obs">👁️ ${p}</span>`).join(" ");
        let wardDisplay = hourlyWardAssignments.join(", ");

        tableHtml += `<tr>
            <td><strong>${shiftHours[h]}</strong></td>
            <td>${obsDisplay}</td>
            <td>${wardDisplay}</td>
        </tr>`;
    }

    tableHtml += `</tbody></table>`;
    document.getElementById("scheduleOutput").innerHTML = tableHtml;

    if (safetyCompromiseTriggered) {
        warningDiv.innerHTML = "⚠️ <strong>Safety Compromise Note:</strong> Due to low staffing levels relative to required active slots, some rest windows had to scale down to the 1-hour minimum to ensure full observation coverage.";
        warningDiv.style.display = "block";
    }
}

function resetApp() {
    document.getElementById("staffInput").value = "";
    document.getElementById("obsNeeded").value = "2";
    document.getElementById("scheduleOutput").innerHTML = "Memory cleared. Submit details to start over.";
    document.getElementById("safetyWarning").style.display = "none";
}
  
</script>

</body>
</html>
